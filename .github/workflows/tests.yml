# Runs the API tests (Postman/Newman) and the UI tests (Selenium/TestNG) on GitHub's servers.
# Triggers: every push to main, every pull request, and the "Run workflow" button.
name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    name: API tests (Postman + Newman)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman and the HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run the Postman collection
        run: |
          mkdir -p reports
          newman run postman/Toolshop-API.postman_collection.json \
            -e postman/toolshop.postman_environment.json \
            -r cli,htmlextra,junit \
            --reporter-htmlextra-export reports/api-report.html \
            --reporter-junit-export reports/api-junit.xml

      - name: Upload the API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/

  ui-tests:
    name: UI tests (Selenium + TestNG)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Google Chrome is already installed on GitHub's Ubuntu machines.
      # Selenium Manager downloads the matching ChromeDriver automatically.
      - name: Run the UI regression suite (headless Chrome)
        run: mvn -B test -Dheadless=true

      - name: Build the Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload the Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/screenshots/
