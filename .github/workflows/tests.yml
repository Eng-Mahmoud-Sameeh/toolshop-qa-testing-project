# Runs the API tests (Postman/Newman) and compiles the UI framework (Selenium/TestNG) on GitHub's servers.
# Triggers: every push to main, every pull request, and the "Run workflow" button.
name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# A new push cancels the older run that is still going for the same branch.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests (Postman + Newman)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Newman and the HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run the Postman collection
        run: |
          mkdir -p reports
          newman run postman/Toolshop-API.postman_collection.json \
            -e postman/toolshop.postman_environment.json \
            -r cli,htmlextra,junit \
            --reporter-htmlextra-export reports/api-report.html \
            --reporter-junit-export reports/api-junit.xml

      - name: Upload the API report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-test-report
          path: reports/

  ui-framework-build:
    # The UI suite itself runs on a local machine: the demo site is behind Cloudflare,
    # which shows a "verify you are not a bot" page to GitHub's data-centre servers.
    # CI still proves on every push that the whole Selenium framework compiles.
    name: UI framework build (compile check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compile the framework and all UI tests
        run: mvn -B test-compile
