# ----------------------------------------------------------------------
# Test configuration. Any value can be overridden from the command line:
#   mvn test -Dheadless=true -Dbrowser=firefox
# or with an environment variable in UPPER_CASE (e.g. HEADLESS=true).
# ----------------------------------------------------------------------
baseUrl=https://practicesoftwaretesting.com
apiUrl=https://api.practicesoftwaretesting.com

# chrome | firefox | edge
browser=chrome
headless=false

# seconds to wait for elements before failing
timeout=15

# how many times a failed test is retried (the public site is sometimes slow)
retryCount=1

# Published demo admin account (shared by everyone on the demo site)
adminEmail=admin@practicesoftwaretesting.com
adminPassword=welcome01
